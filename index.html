<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Customer Management System</h1>

        <div class="customer-form">

            <h2>Add Customer</h2>
            <hr>

            <div class="input-group">
                <label>Customer ID</label>
                <input type="text" id="txtId" placeholder="Enter Customer ID">
            </div>

            <div class="input-group">
                <label>Customer Name</label>
                <input type="text" id="txtName" placeholder="Enter Customer Name">
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" id="txtAge" placeholder="Enter Age">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" id="txtAddress" placeholder="Enter Address">
            </div>

            <div class="input-group">
                <label>Salary</label>
                <input type="number" id="txtSalary" placeholder="Enter Salary">
            </div>

            <button onclick="addCustomer()">Add Customer</button>

        </div>

        <div class="customer-table">

            <h2>Customer Details</h2>
            <hr>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Address</th>
                        <th>Salary</th>
                    </tr>
                </thead>

                <tbody id="tblCustomer">

                </tbody>
            </table>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
